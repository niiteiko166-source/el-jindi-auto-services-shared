services:
  - type: web
    name: el-jindi-auto-services
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: el-jindi-postgres
          property: connectionString
      - key: BUSINESS_STORE_PATH
        fromDatabase:
          name: el-jindi-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: DEFAULT_ADMIN_PASSWORD
        sync: false
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: BACKUP_DIR
        value: /tmp/backups
      - key: LOG_FILE
        value: /tmp/app.log

databases:
  - name: el-jindi-postgres
    plan: free
    databaseName: eljindi
    user: eljindi_app
