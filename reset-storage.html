<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resetting Storage...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            margin: 0 0 10px 0;
        }
        p {
            color: #666;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Resetting Application Data...</h1>
        <p>Please wait while we initialize the price list...</p>
    </div>
    
    <script>
        // Clear all localStorage
        localStorage.clear();
        
        // Also clear sessionStorage
        sessionStorage.clear();
        
        // Small delay to ensure storage is cleared
        setTimeout(() => {
            // Redirect to the price list
            window.location.href = 'http://localhost:3004/#/price-list';
        }, 1000);
    </script>
</body>
</html>
